[project]
name = "signed-charge"
version = "0.1.0"
description = "Signed minutiae statistics on real and synthetic fingerprints: code to reproduce the paper's measurements"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "opencv-python-headless==5.0.0.93",
    "scikit-image==0.26.0",
    "pillow==12.3.0",
    "onnxruntime==1.30.0",
]

[project.optional-dependencies]
# The matcher test (reads.tstr). GPU needed; the wheels are CUDA 13.
matcher = ["torch==2.14.1", "torchvision==0.29.1"]
# The diffusion render of ZP's masters (ridgegen.diffusion), with IMPOSE from tools.
diffusion = ["torch==2.14.1", "torchvision==0.29.1", "pytorch_lightning==2.5.6", "omegaconf==2.3.1", "einops==0.8.2", "tqdm", "gdown", "safetensors==0.8.0"]
figures = ["matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signed_charge", "src/ridgegen"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 160
